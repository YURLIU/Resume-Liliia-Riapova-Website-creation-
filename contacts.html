        <h1>Зв'язатися зі мною</h1>

        <p>
            Якщо ви хочете запропонувати співпрацю, замовити сайт
            або просто поставити запитання — можете написати мені.
        </p>

        <section class="contact-form">

            <h2>Написати повідомлення</h2>

            <form id="contact-form">

                <label for="name">Ваше ім'я</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Ваш Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Повідомлення</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Надіслати повідомлення</button>

            </form>

        </section>
